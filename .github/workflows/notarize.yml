name: Notarize macOS (6d 正式发布)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（如 v0.4.0），留空则用最新 tag'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  notarize:
    name: 签名 + 公证 + 上传 Release
    runs-on: macos-latest
    env:
      DEVELOPER_ID_APP_CERT_B64: ${{ secrets.DEVELOPER_ID_APP_CERT_B64 }}
      DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 编译 Universal .app
        run: |
          cd macos
          make build-app

      - name: 导入 Developer ID 证书
        run: |
          echo "$DEVELOPER_ID_APP_CERT_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$DEVELOPER_ID_APP_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain
          echo "✅ 证书已导入"

      - name: Developer ID 签名 + Hardened Runtime
        run: |
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "证书: $CERT_ID"
          codesign --force --deep --options runtime \
            --sign "$CERT_ID" \
            --keychain build.keychain \
            macos/CloudWubi.app
          codesign -dv macos/CloudWubi.app 2>&1 | grep -E "Signature|Format" || true

      - name: 打包
        run: |
          cd macos
          tar -czf ../CloudWubi.app.tar.gz CloudWubi.app
          cd ..
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: 提交 Apple 公证（notarytool）
        run: |
          # 提交公证并等待结果
          xcrun notarytool submit CloudWubi.app.tar.gz \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee /tmp/notary.json
          # 检查结果
          STATUS=$(python3 -c "import json; print(json.load(open('/tmp/notary.json'))['status'])")
          if [ "$STATUS" != "Accepted" ]; then
            echo "❌ 公证未通过: $STATUS"
            exit 1
          fi
          echo "✅ 公证通过"

      - name: 装订（stapler）
        run: |
          xcrun stapler staple macos/CloudWubi.app
          echo "✅ 装订完成"

      - name: 重新打包（含装订）
        run: |
          cd macos
          tar -czf ../CloudWubi.app-notarized.tar.gz CloudWubi.app
          cd ..

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --limit 1 | awk '{print $1}')
          fi
          gh release upload "$TAG" CloudWubi.app-notarized.tar.gz --clobber
          echo "✅ 已上传到 Release $TAG"
