name: macOS Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'macos/**'
      - '.github/workflows/macos-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: macOS 编译 + 测试 + 体积门禁
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 编译（macOS 原生 clang）
        run: |
          cc --version | head -1
          make clean
          make
          ls -la cloudwubi_demo

      - name: 体积门禁（< 800KB）
        run: |
          SIZE=$(stat -f%z cloudwubi_demo)
          echo "macOS 二进制体积: $SIZE 字节"
          if [ "$SIZE" -gt 819200 ]; then
            echo "❌ 体积超标（> 800KB）"
            exit 1
          fi
          echo "✅ 体积达标（< 800KB）"

      - name: 单元测试
        run: |
          make test

      - name: 阶段6 查询引擎测试 + .app 打包
        run: |
          cd macos
          make test
          make build-app
          ls -la CloudWubi.app/Contents/MacOS/

      - name: 端到端冒烟（本地回环）
        run: |
          # 用 Python 起本地网关做端到端验证
          python3 - <<'EOF' &
          import json, sys
          sys.path.insert(0, '.')
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_POST(self):
                  ln = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(ln).decode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({"code":"wqvb","candidates":[20320,22909],"phrases":["你好","您好"]}).encode())
              def log_message(self, *a): pass
          HTTPServer(('127.0.0.1', 8000), H).serve_forever()
          EOF
          GW_PID=$!
          sleep 2
          echo "wqvb" | ./cloudwubi_demo | grep -a "你好" && echo "✅ macOS 端到端通过" || echo "⚠️ 端到端输出检查"
          kill $GW_PID 2>/dev/null || true

      - name: 上传 macOS 制品
        uses: actions/upload-artifact@v4
        with:
          name: cloudwubi-client-macos-x86_64
          path: cloudwubi_demo
