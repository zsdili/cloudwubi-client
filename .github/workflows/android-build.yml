name: Android Build

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager --install "build-tools;34.0.0" "platforms;android-34" >/dev/null 2>&1 || true
          yes | sdkmanager --install "build-tools;34.0.0" "platforms;android-33" >/dev/null 2>&1 || true
          ls "$ANDROID_HOME/build-tools/"
          ls "$ANDROID_HOME/platforms/"

      - name: 构建 APK
        run: |
          cd android
          bash build_apk.sh

      - name: 回归自检（机器级自我记忆：历史出错点锚点核查）
        run: |
          bash scripts/regression_check.sh android/build-apk/CloudWubi.apk

      - name: JVM 引擎回归测试（真实代码，非模拟器：Calc/联想/MRU/词库）
        run: |
          mkdir -p /tmp/javatests
          javac -encoding UTF-8 -d /tmp/javatests \
            android/app/src/main/java/com/cloudwubi/ime/CalcEngine.java \
            android/app/src/main/java/com/cloudwubi/ime/MruEngine.java \
            android/app/src/main/java/com/cloudwubi/ime/AssociateEngine.java \
            android/app/src/main/java/com/cloudwubi/ime/VersionUtil.java \
            android/tests/CalcEngineTest.java \
            android/tests/calcflow/CalcFlowTest.java \
            android/tests/MruEngineTest.java \
            android/tests/AssociateEngineTest.java \
            android/tests/VersionUtilTest.java > /tmp/javac_out.txt 2>&1
          if [ $? -ne 0 ]; then echo "── javac 编译错误（完整）──"; head -40 /tmp/javac_out.txt; exit 1; fi
          echo "── 连续计算流程测试（4-6=-2→+5=3 / 2*3=6→*4=24）──"
          java -cp /tmp/javatests com.cloudwubi.ime.CalcFlowTest
          echo "── CalcEngine 引擎测试 ──"
          java -cp /tmp/javatests CalcEngineTest
          echo "── MRU 引擎测试 ──"
          java -cp /tmp/javatests MruEngineTest
          echo "── 联想引擎测试 ──"
          java -cp /tmp/javatests AssociateEngineTest
          echo "── 版本工具测试 ──"
          java -cp /tmp/javatests VersionUtilTest

      - name: 上传 APK 工件
        uses: actions/upload-artifact@v4
        with:
          name: cloudwubi-apk
          path: |
            android/build-apk/CloudWubi.apk
            android/build-apk/CloudWubi-v*.apk

      - name: 上传 Release 资产（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release upload "$TAG" android/build-apk/CloudWubi.apk --clobber
